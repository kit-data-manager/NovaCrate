name: Playwright Tests
on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
jobs:
  playwright:
    name: 'Playwright Tests'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Build NovaCrate
        run: npm run build:test
        env:
          IFRAME_TARGET_ORIGIN: 'http://localhost:3000'
      - name: Run playwright tests
        run: npm run test:e2e
      - name: Upload Playwright Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/index.html
          retention-days: 30
      - name: Append Playwright Report to GitHub Summary
        if: ${{ !cancelled() }}
        run: echo "Playwright tests completed. [View Report](./playwright-report/index.html)" >> $GITHUB_STEP_SUMMARY